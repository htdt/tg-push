[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-push"
version = "2.1.0"
description = "Single-shot CLI for sending text plus an optional file to Telegram."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Alex Ermolov", email = "alex@ermolov.space" }]
dependencies = []
keywords = ["telegram", "cli", "bot", "notification"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/htdt/tg-push"
Issues = "https://github.com/htdt/tg-push/issues"

[project.scripts]
tg-push = "tg_push:main"

[tool.setuptools]
py-modules = ["tg_push"]
